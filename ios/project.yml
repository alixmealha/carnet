# Projet Xcode de l'appli iPhone Alipto, généré par XcodeGen (xcodegen generate).
# Le .xcodeproj n'est pas versionné : la chaîne GitHub « iOS » le génère, compile et prend des captures du simulateur.
name: Alipto
options:
  bundleIdPrefix: app.alipto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Alipto:
    type: application
    platform: iOS
    sources:
      - path: Alipto
        excludes:
          - "Resources/Core/**"
      # logique partagée avec la version web (construite par node ios/core/build.mjs) et base d'aliments
      - path: Alipto/Resources/Core
        type: folder
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: AliptoWidgets
    entitlements:
      path: Alipto/Alipto.entitlements
      properties:
        com.apple.security.application-groups: [group.app.alipto]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alipto.Alipto
        PRODUCT_NAME: Alipto
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Alipto/Info.plist
      properties:
        CFBundleDisplayName: Alipto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Alipto lit ta nuit (durée et phases), ta VFC et ta fréquence cardiaque de repos pour remplir la carte Sommeil et la lecture du jour."
        NSHealthUpdateUsageDescription: "Alipto n’écrit rien dans Apple Santé."
        NSMotionUsageDescription: "Le téléphone sert d’inclinomètre pour mesurer les angles des tests de mobilité."
        UIAppFonts:
          - BigShouldersDisplay-ExtraBold.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
  # Widgets de l'écran d'accueil et minuteur de repos sur l'écran verrouillé (Live Activity)
  AliptoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Alipto/Sources/UI/Theme.swift
      - path: Alipto/Resources/Fonts
        buildPhase: resources
    entitlements:
      path: Widgets/AliptoWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.alipto]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.alipto.Alipto.Widgets
        PRODUCT_NAME: AliptoWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alipto
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Alipto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BigShouldersDisplay-ExtraBold.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf
          - IBMPlexSans-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
