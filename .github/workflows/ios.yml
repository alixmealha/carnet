name: iOS
# Appli iPhone : génère le projet Xcode (XcodeGen), compile pour le simulateur, prend des captures d'écran
# (mode démo, clair et sombre) et fournit le projet généré. Aucune signature ni secret ici.
on:
  push:
    branches: [main]
    paths: ['ios/**', 'src/lib/**', 'public/aliments.json', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      screens:
        description: 'Écrans à capturer (séparés par des espaces)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          xcodebuild -version
          sw_vers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # logique partagée avec la version web : reconstruite depuis src/lib et vérifiée
      - name: Logique partagée
        run: |
          npm ci --no-audit --no-fund >/dev/null
          node ios/core/build.mjs
          node ios/core/test.mjs
      - name: Projet (XcodeGen)
        run: |
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate
      - name: Compilation (simulateur)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Alipto.xcodeproj -scheme Alipto -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build > build.log 2>&1 || BUILD_FAILED=1
          grep -E "error:|warning:" build.log | grep -v "appintents" | sort -u > problems.txt || true
          head -100 problems.txt
          [ -z "$BUILD_FAILED" ] || exit 1
      - name: Captures
        run: |
          cd ios
          mkdir -p shots
          DEV=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          pref=[x for x in c if x['name'] in ('iPhone 16 Pro','iPhone 16','iPhone 17 Pro','iPhone 17')]
          print((pref or c)[0]['udid'])")
          echo "Appareil : $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          APP=$(find build/Build/Products -name "Alipto.app" -maxdepth 3 | head -1)
          xcrun simctl install "$DEV" "$APP"
          SCREENS="${{ github.event.inputs.screens }}"
          [ -z "$SCREENS" ] && SCREENS=$(cat shots.txt 2>/dev/null || echo "today")
          for scheme in light dark; do
            xcrun simctl ui "$DEV" appearance $scheme
            for s in $SCREENS; do
              xcrun simctl launch --terminate-running-process "$DEV" app.alipto.Alipto -demo 1 -screen "$s" >/dev/null
              case "$s" in nutri|builder|dayedit) sleep 8 ;; *) sleep 5 ;; esac
              xcrun simctl io "$DEV" screenshot "shots/$scheme-$s.png" >/dev/null 2>&1
            done
          done
          xcrun simctl spawn "$DEV" log show --last 3m --predicate 'process == "Alipto"' --style compact 2>/dev/null | grep -iE "fault|error|alipto:" | tail -40 > shots/log.txt || true
          ls shots
      - name: Projet généré
        if: always()
        run: cd ios && zip -qr Alipto-xcodeproj.zip Alipto.xcodeproj Alipto/Info.plist Alipto/Alipto.entitlements Widgets/Info.plist Widgets/AliptoWidgets.entitlements || true
      # Résultats (erreurs, captures, projet) sur la branche ios-ci : lisibles avec git, sans téléchargement d'artefact
      - name: Résultats → branche ios-ci
        if: always()
        run: |
          mkdir -p ci-out
          cp -r ios/shots ci-out/ 2>/dev/null || true
          cp ios/problems.txt ci-out/ 2>/dev/null || true
          tail -300 ios/build.log > ci-out/build-tail.log 2>/dev/null || true
          cp ios/Alipto-xcodeproj.zip ci-out/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }} $(date -u +%FT%TZ)" > ci-out/STATUS
          cd ci-out
          git init -q && git checkout -q -b ios-ci && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ios-ci
